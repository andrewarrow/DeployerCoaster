[package]
name = "deployercoaster-studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "GPL-3.0-only"
description = "DeployerCoaster desktop studio"
build = "build.rs"

[[bin]]
name = "studio"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
time = "0.3"
dirs = "6"
egui = "0.35"
egui-wgpu = { version = "0.35", features = ["winit"] }
egui-winit = "0.35"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
jsonwebtoken = "9.3"
log = "0.4"
oauth2 = { version = "5", default-features = false, features = ["reqwest-blocking", "rustls-tls", "timing-resistant-secret-traits"] }
pollster = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
tempfile = "3"
winit = "0.30"
webbrowser = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication", "NSEvent", "NSCell", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication",
    "NSAttributedString", "NSColor", "NSFont", "NSParagraphStyle", "NSText", "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSData", "NSDictionary", "NSObject", "NSString", "NSAttributedString", "NSRange",
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package.moxcms]
opt-level = 3
