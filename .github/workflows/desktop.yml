name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - platform: windows
            arch: x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: linux
            arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python for packaging
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libudev-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libvulkan1 \
            mesa-vulkan-drivers

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Check formatting
        working-directory: studio
        run: cargo fmt --all -- --check

      - name: Build
        working-directory: studio
        run: cargo build --locked --release --target ${{ matrix.target }} --bin studio

      - name: Test
        working-directory: studio
        run: cargo test --locked --target ${{ matrix.target }} --bin studio

      - name: Clippy
        working-directory: studio
        run: cargo clippy --locked --target ${{ matrix.target }} --bin studio -- -D warnings

      - name: Package portable application
        run: >-
          python studio/packaging/package.py
          --platform ${{ matrix.platform }}
          --target ${{ matrix.target }}
          --out-dir dist

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: deployercoaster-studio-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
